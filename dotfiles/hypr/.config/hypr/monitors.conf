# PERFIL BARE METAL — 3 MONITORES  (DESCOMENTAR na maquina real)
#
# COMO PREENCHER:
#   1) Rode:  hyprctl monitors all
#   2) Anote o NOME (ex.: DP-1, DP-2, HDMI-A-1), resolucao@refresh e a ordem fisica.
#   3) A POSICAO define o arranjo lado a lado. Ex.: tres telas em linha,
#      esquerda comeca em 0x0, central em 1920x0, direita em 4480x0.
#
# Exemplo (AJUSTE nomes/resolucoes aos SEUS monitores):
# monitor = DP-1,     1920x1080@144, 0x0,    1     # esquerda
# monitor = DP-2,     2560x1440@144, 1920x0, 1     # centro (principal)
# monitor = HDMI-A-1, 1920x1080@60,  4480x0, 1     # direita
#
# Ancorar workspaces a cada tela (fluxo previsivel):
# workspace = 1, monitor:DP-2, default:true
# workspace = 2, monitor:DP-2
# workspace = 3, monitor:DP-2
# workspace = 4, monitor:DP-1
# workspace = 5, monitor:DP-1
# workspace = 6, monitor:HDMI-A-1
# workspace = 7, monitor:HDMI-A-1
#
# Tela na vertical? adicione transform no fim (1 = 90 graus, 3 = 270):
# monitor = HDMI-A-1, 1920x1080@60, 4480x0, 1, transform, 1
#
# Desligar uma saida:  monitor = NOME, disable
