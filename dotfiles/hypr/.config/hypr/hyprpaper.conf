# Coloque um arquivo wall.jpg em ~/.config/hypr/  (o install.sh tenta baixar um Catppuccin).
preload = ~/.config/hypr/wall.jpg
wallpaper = , ~/.config/hypr/wall.jpg
splash = false
ipc = on

# BARE METAL (3 telas): defina por monitor, ou use "," p/ aplicar em todas.
# wallpaper = DP-1, ~/.config/hypr/wall.jpg
# wallpaper = DP-2, ~/.config/hypr/wall.jpg
# wallpaper = HDMI-A-1, ~/.config/hypr/wall.jpg
