# hyprlock — Catppuccin Mocha. Valide contra a wiki do hyprlock na sua versao.
$font = JetBrainsMono Nerd Font

background {
    monitor =
    color = rgba(1e1e2eff)      # Catppuccin base
    # Para borrar um screenshot da tela em vez de cor solida:
    # path = screenshot
    blur_passes = 2
    blur_size = 6
    contrast = 0.9
    brightness = 0.8
}

# Relogio (hora)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(cdd6f4ff)      # text
    font_size = 90
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(bac2deff)      # subtext1
    font_size = 22
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = $USER
    color = rgba(89b4faff)      # blue
    font_size = 16
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(89b4faee)    # blue
    inner_color = rgba(313244ff)    # surface0
    font_color = rgba(cdd6f4ff)     # text
    fade_on_empty = false
    placeholder_text = <i>Senha...</i>
    hide_input = false
    check_color = rgba(a6e3a1ff)    # green (verificando)
    fail_color = rgba(f38ba8ff)     # red (senha errada)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}
