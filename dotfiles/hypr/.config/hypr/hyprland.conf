# =============================================================================
#  hyprland.conf  —  Catppuccin Mocha  —  perfil VM (VMware) com caminho p/ bare metal
#  Gerado no Windows como staging. Valide na máquina real:  hyprland --version
#  Sintaxe conferida contra a wiki atual (backend aquamarine, seção shadow{},
#  windowrule unificado). Ver README.md -> "Diferenças vs. wiki".
# =============================================================================

# Config multi-monitor (perfil VM x 3 monitores mora aqui):
source = ~/.config/hypr/monitors.conf

################  AJUSTES DE VM (remover/ajustar no bare metal)  ################
# Backend atual = aquamarine (substituiu wlroots na 0.42+). As variáveis WLR_*
# antigas nao valem mais; controle de cursor por hardware agora e via cursor{}.
cursor {
    no_hardware_cursors = true      # essencial em VM (evita cursor invisivel/tela preta)
}

# Descomente SO se o Hyprland nao subir por falta de aceleracao 3D na VM.
# LIBGL_ALWAYS_SOFTWARE e do Mesa (continua valido). WLR_RENDERER_ALLOW_SOFTWARE
# era do wlroots e NAO se aplica mais com aquamarine — nao use.
# env = LIBGL_ALWAYS_SOFTWARE,1

################  PROGRAMAS  ################
$terminal = kitty
$menu = wofi --show drun
$fileManager = thunar
$mainMod = SUPER

################  AUTOSTART  ################
exec-once = waybar & hyprpaper & swaync
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store

################  VARIAVEIS DE AMBIENTE  ################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

################  VISUAL  ################
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 5
        passes = 2
    }

    # shadow e uma subsecao propria desde a era aquamarine (nao mais drop_shadow=).
    shadow {
        enabled = false             # ligar no bare metal (custa GPU)
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, default
    animation = border, 1, 8, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

input {
    kb_layout = br               # teclado ABNT2. Troque p/ "us" se for teclado US.
    kb_variant = abnt2           # remova esta linha se kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe = true
}

misc {
    vrr = 1                      # util no bare metal; inocuo na VM
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

################  ATALHOS  ################
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, J, togglesplit,
bind = $mainMod, P, pseudo,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Foco entre janelas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Foco/mover ENTRE MONITORES (essencial pros 3 monitores)
bind = $mainMod CTRL, left, focusmonitor, l
bind = $mainMod CTRL, right, focusmonitor, r
bind = $mainMod CTRL SHIFT, left, movewindow, mon:l
bind = $mainMod CTRL SHIFT, right, movewindow, mon:r

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover janela para workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse: mover/redimensionar
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Midia / volume / brilho
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind  = , XF86AudioPlay, exec, playerctl play-pause
bind  = , XF86AudioNext, exec, playerctl next
bind  = , XF86AudioPrev, exec, playerctl previous
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

################  REGRAS DE JANELA — STEAM/JOGOS  ################
# Sintaxe atual: windowrule (o "windowrulev2" foi deprecado/unificado).
windowrule = float, class:^(steam)$, title:^(Friends List)$
windowrule = float, class:^(steam)$, title:^(Steam Settings)$
windowrule = fullscreen, class:^(gamescope)$
windowrule = immediate, class:^(steam_app_).*$

# Utilitarios que ficam melhor flutuando
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = float, title:^(Open File)$
